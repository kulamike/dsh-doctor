<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DSH doctor">
  <title>DSH 急救箱</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16395f"/>
      <stop offset="1" stop-color="#0a1e36"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c39a"/>
      <stop offset="1" stop-color="#f6dfc4"/>
    </linearGradient>
  </defs>

  <!-- 深蓝底板 -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#plate)"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="#2fd6ff" stroke-opacity="0.22" stroke-width="1.2"/>

  <!-- 急救箱 -->
  <rect x="14.5" y="22" width="35" height="27" rx="5.5" fill="#0f2a4a" stroke="#2fd6ff" stroke-width="2.4"/>
  <path d="M26 22v-3.6a3.2 3.2 0 0 1 3.2-3.2h5.6A3.2 3.2 0 0 1 38 18.4V22"
        fill="none" stroke="#2fd6ff" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 箱内的心跳线 -->
  <path d="M18.5 37h4l2.5-7.5 4.5 14 3-9.5 2 3h4.5"
        fill="none" stroke="url(#pulse)" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
